<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>লিস্টিং — সুনামগঞ্জ জিলা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root{--primary:#0d7c6e;--primary-dark:#085f54;--accent:#f5a623;--bg:#f4f6f8;--white:#fff;--text:#1a1a2e;--muted:#6b7280;--border:#e5e7eb;--radius:12px;--danger:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--primary);height:56px;display:flex;align-items:center;padding:0 1rem;gap:.7rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.back-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:1.1rem;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-title{font-family:'Noto Serif Bengali',serif;color:#fff;font-size:1.05rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-header{background:rgba(255,255,255,.15);border:none;outline:none;color:#fff;font-family:'Hind Siliguri',sans-serif;font-size:.88rem;padding:.32rem .75rem;border-radius:50px;width:130px;flex-shrink:0}
.search-header::placeholder{color:rgba(255,255,255,.6)}
/* FILTER BAR */
.filter-bar{background:var(--white);border-bottom:1px solid var(--border);padding:.5rem 1rem;display:flex;gap:.5rem;overflow-x:auto}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{background:var(--bg);border:1px solid var(--border);border-radius:50px;padding:.3rem .9rem;font-size:.78rem;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;font-family:'Hind Siliguri',sans-serif;color:var(--text)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* SORT BAR */
.sort-bar{max-width:480px;margin:0 auto;padding:.5rem 1rem;display:flex;gap:.5rem;align-items:center;overflow-x:auto}
.sort-bar::-webkit-scrollbar{display:none}
.sort-chip{background:var(--white);border:1px solid var(--border);border-radius:50px;padding:.28rem .85rem;font-size:.76rem;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;font-family:'Hind Siliguri',sans-serif;color:var(--text)}
.sort-chip.active{background:var(--primary-dark);color:#fff;border-color:var(--primary-dark)}
/* LIST */
.list-wrap{max-width:480px;margin:0 auto;padding:.8rem 1rem 80px}
.entry-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:.8rem;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:box-shadow .2s}
.entry-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.entry-img{width:100%;height:160px;object-fit:cover;background:linear-gradient(135deg,#e0f2f1,#b2dfdb);display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer;position:relative;overflow:hidden}
.entry-img img{width:100%;height:100%;object-fit:cover}
.entry-body{padding:.85rem 1rem}
.entry-title{font-family:'Noto Serif Bengali',serif;font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.2rem}
.entry-specialty{font-size:.82rem;color:var(--primary);font-weight:600;margin-bottom:.15rem}
.entry-place{font-size:.8rem;color:var(--muted);margin-bottom:.3rem;display:flex;align-items:center;gap:.3rem}
.entry-desc{font-size:.85rem;color:#374151;line-height:1.65;margin-bottom:.5rem}
/* RATING DISPLAY */
.rating-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem}
.stars-display{color:#f59e0b;font-size:.9rem;letter-spacing:1px}
.rating-count{font-size:.75rem;color:var(--muted)}
/* ACTIONS */
.entry-actions{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{padding:.48rem .7rem;border-radius:8px;border:none;font-family:'Hind Siliguri',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.25rem;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff;flex:1}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:#f0faf8}
.btn-wa{background:#25d366;color:#fff}
.btn-wa:hover{background:#1da851}
.btn-print{background:#f3f4f6;color:var(--text);border:1px solid var(--border)}
/* FAB */
.fab{position:fixed;bottom:70px;right:1rem;width:52px;height:52px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:1.5rem;box-shadow:0 4px 16px rgba(13,124,110,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:90;transition:transform .2s}
.fab:hover{transform:scale(1.08)}
/* MODALS */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.mc{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:1.5rem 1.2rem 2rem;max-height:92vh;overflow-y:auto;animation:su .3s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mh{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 1rem}
.mtt{font-family:'Noto Serif Bengali',serif;font-size:1.1rem;font-weight:700;color:var(--primary);text-align:center;margin-bottom:1rem;padding-bottom:.7rem;border-bottom:2px solid var(--primary)}
.dr{margin-bottom:.7rem}
.dl{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.12rem}
.dv{font-size:.9rem;color:var(--text);line-height:1.6}
.ma{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
/* RATING STARS INPUT */
.stars-input{display:flex;gap:.3rem;justify-content:center;margin:.7rem 0;flex-direction:row-reverse}
.stars-input input{display:none}
.stars-input label{font-size:1.8rem;cursor:pointer;color:#d1d5db;transition:color .2s}
.stars-input label:hover,.stars-input label:hover~label,.stars-input input:checked~label{color:#f59e0b}
/* REVIEW LIST */
.review-item{padding:.65rem 0;border-bottom:1px solid var(--border)}
.review-stars{color:#f59e0b;font-size:.85rem;margin-bottom:.2rem}
.review-text{font-size:.85rem;color:var(--text);line-height:1.6}
.review-date{font-size:.72rem;color:var(--muted);margin-top:.15rem}
/* SUBMIT FORM */
.ff{margin-bottom:.85rem}
.ff label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.28rem}
.ff input,.ff select,.ff textarea{width:100%;padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:var(--radius);font-family:'Hind Siliguri',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s;color:var(--text)}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--primary)}
.ff textarea{resize:vertical;min-height:72px}
.bf{width:100%;padding:.7rem;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);font-family:'Hind Siliguri',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer}
.bf:disabled{opacity:.6;cursor:not-allowed}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
@media(max-width:360px){.g2{grid-template-columns:1fr}}
.em{color:var(--danger);font-size:.79rem;margin-top:.35rem;display:none}
.img-up{width:100%;height:110px;border:2px dashed var(--border);border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;overflow:hidden;position:relative}
.img-up img{width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0}
.img-up .iph{text-align:center;color:var(--muted);font-size:.8rem;pointer-events:none}
.iph span{display:block;font-size:1.6rem;margin-bottom:.15rem}
/* SKELETON */
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state .big{font-size:3rem;margin-bottom:.5rem}
/* NEARBY BADGE */
.nearby-badge{background:#10b981;color:#fff;font-size:.65rem;padding:.1rem .4rem;border-radius:50px;font-weight:700;margin-left:.3rem}
/* PRINT */
@media print{
  header,nav,.bottom-nav,.fab,.entry-actions,.filter-bar,.sort-bar{display:none!important}
  .entry-card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:.45rem 1.1rem;border-radius:50px;font-size:.83rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}
#toast.ok{background:var(--primary)}
#toast.bad{background:var(--danger)}
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="header-title" id="pageTitle">লোড হচ্ছে...</span>

</header>

<div class="filter-bar" id="filterBar">

<div class="sort-bar">

<div class="list-wrap" id="listWrap"></div>

 <div class="mc">

  <div id="detBody"></div>
  <div class="ma" id="detActions"></div>
  <!-- REVIEWS -->
  <div style="margin-top:1.2rem;border-top:1px solid var(--border);padding-top:1rem">

   <div id="reviewsList"><p style="color:var(--muted);font-size:.83rem">লোড হচ্ছে...</p></div>

     <input type="radio" name="rating" id="s5" value="5"/><label for="s5">★</label>

 </div>
</div>

<!-- SUBMIT MODAL -->
<div class="mo" id="subMo" onclick="cib(event,'subMo')">
 <div class="mc">
  <div class="mh"></div>
  <div style="font-family:'Noto Serif Bengali',serif;font-size:1.1rem;font-weight:700;color:var(--primary);text-align:center;margin-bottom:.7rem">➕ নতুন তথ্য যোগ করুন</div>
  <p style="font-size:.78rem;color:#92400e;text-align:center;background:#fef3c7;border-radius:8px;padding:.45rem;margin-bottom:.9rem">অ্যাডমিনের অনুমোদনের পর সাইটে দেখাবে</p>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9GwLcflSBxtQK363uo3Gnc0FV6mdZqQ0",
  authDomain: "sunamganj-zila-610da.firebaseapp.com",
  projectId: "sunamganj-zila-610da",
  storageBucket: "sunamganj-zila-610da.firebasestorage.app",
  messagingSenderId: "679956536370",
  appId: "1:679956536370:web:c8ab22f72aa0431d94b02b",
  measurementId: "G-QDV39Z1C1B"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(), auth=firebase.auth();

const params=new URLSearchParams(location.search);
const CAT=params.get('cat')||'', NAME=params.get('name')||'লিস্টিং', SEARCH=params.get('search')||'';
document.getElementById('pageTitle').textContent=SEARCH?`"${SEARCH}"`:NAME;
if(SEARCH) document.getElementById('searchInput').value=SEARCH;

let allEntries=[], activeThana='', searchQ=SEARCH, sortMode='newest', CU=null, currentEntryId=null;
auth.onAuthStateChanged(u=>{CU=u;});

// RENDER
function starsHtml(r){
  const n=Math.round(r||0);
  return '★'.repeat(n)+'☆'.repeat(5-n);
}
function renderEntries(list){
  const w=document.getElementById('listWrap');
  if(!list.length){w.innerHTML=`<div class="empty-state"><div class="big">🔍</div><p>কোনো তথ্য পাওয়া যায়নি</p></div>`;return;}
  w.innerHTML=list.map(e=>`
    <div class="entry-card">
      <div class="entry-img" onclick='openDet("${e.id}")'>
        ${e.imageUrl?`<img src="${e.imageUrl}" alt="${e.title||''}" loading="lazy"/>`:`<span>${e.icon||'📋'}</span>`}
      </div>
      <div class="entry-body">
        <div class="entry-title">${e.title||''} ${e._nearby?'<span class="nearby-badge">📍 কাছে</span>':''}</div>
        ${e.specialty?`<div class="entry-specialty">বিশেষজ্ঞঃ ${e.specialty}</div>`:''}
        ${e.thana?`<div class="entry-place">📍 ${e.thana} থানা</div>`:''}
        ${e.address?`<div class="entry-place">🏢 ${e.address}</div>`:''}
        ${(e.avgRating||0)>0?`<div class="rating-row"><span class="stars-display">${starsHtml(e.avgRating)}</span><span class="rating-count">(${e.reviewCount||0} রিভিউ)</span></div>`:''}
        ${e.description?`<div class="entry-desc">${e.description.substring(0,100)}${e.description.length>100?'...':''}</div>`:''}
        <div class="entry-actions">
          <button class="btn btn-outline" onclick='openDet("${e.id}")'>বিস্তারিত</button>
          ${e.mapUrl?`<a class="btn btn-outline" href="${e.mapUrl}" target="_blank">🗺️</a>`:''}
          ${e.phone?`<a class="btn btn-primary" href="tel:${e.phone}">📞 ফোন</a>`:''}
          <button class="btn btn-wa" onclick='shareWA("${e.id}")'>📲 শেয়ার</button>
          <button class="btn btn-print" onclick='printEntry("${e.id}")'>🖨️</button>
        </div>
      </div>
    </div>`).join('');
}

async function loadEntries(){
  document.getElementById('listWrap').innerHTML=`<div style="padding:1rem">${[1,2,3].map(()=>`
    <div class="entry-card" style="padding:1rem">
      <div class="skeleton" style="height:140px;border-radius:8px;margin-bottom:.8rem"></div>
      <div class="skeleton" style="height:16px;width:60%;margin-bottom:.5rem"></div>
      <div class="skeleton" style="height:12px;width:80%"></div></div>`).join('')}</div>`;
  try{
    let q=db.collection('entries');
    if(CAT&&!SEARCH) q=q.where('category','==',CAT);
    q=q.orderBy('createdAt','desc');
    const snap=await q.get();
    allEntries=snap.docs.map(d=>({id:d.id,...d.data()}));
    applyFilters();
  }catch(e){
    document.getElementById('listWrap').innerHTML=`<div class="empty-state"><div class="big">⚠️</div><p>ডেটা লোড সমস্যা<br><small>${e.message}</small></p></div>`;
  }
}

function applyFilters(){
  let list=[...allEntries];
  if(activeThana) list=list.filter(e=>e.thana===activeThana);
  if(searchQ){const q=searchQ.toLowerCase();
    list=list.filter(e=>(e.title||'').toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)||
      (e.specialty||'').toLowerCase().includes(q)||(e.address||'').toLowerCase().includes(q));}
  if(sortMode==='rating') list.sort((a,b)=>(b.avgRating||0)-(a.avgRating||0));
  renderEntries(list);
}

// FILTERS
document.querySelectorAll('.filter-chip').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); activeThana=b.dataset.thana; applyFilters();
  });
});
document.getElementById('searchInput').addEventListener('input',e=>{searchQ=e.target.value.trim();applyFilters();});

function setSort(el,mode){
  document.querySelectorAll('.sort-chip').forEach(x=>x.classList.remove('active'));
  el.classList.add('active'); sortMode=mode; applyFilters();
}

// NEARBY GPS
function getNearby(el){
  if(!navigator.geolocation){showToast('আপনার ব্রাউজার GPS সাপোর্ট করে না','bad');return;}
  showToast('আপনার অবস্থান নির্ণয় হচ্ছে...','');
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lng}=pos.coords;
    // Mark entries that have mapUrl with coords as nearby (simplified)
    allEntries.forEach(e=>{
      if(e.thana==='সুনামগঞ্জ সদর') e._nearby=true; // placeholder - real use requires lat/lng in entries
    });
    setSort(el,'nearby');
    showToast('কাছের সেবা দেখানো হচ্ছে 📍','ok');
  },()=>showToast('অবস্থান পাওয়া যায়নি','bad'));
}

// MODAL
const om=id=>document.getElementById(id).classList.add('open');
const cm=id=>document.getElementById(id).classList.remove('open');
const cib=(e,id)=>{if(e.target===document.getElementById(id))cm(id);};

async function openDet(id){
  const e=allEntries.find(x=>x.id===id);
  if(!e) return;
  currentEntryId=id;
  document.getElementById('detTitle').textContent=e.title||'';
  let h='';
  if(e.specialty) h+=row('বিশেষজ্ঞ',e.specialty);
  if(e.education) h+=row('শিক্ষাগত যোগ্যতা',e.education);
  if(e.workplace) h+=row('বর্তমান কর্মস্থল',e.workplace);
  if(e.chambers)  h+=row('চেম্বার',e.chambers);
  if(e.thana)     h+=row('থানা',e.thana);
  if(e.address)   h+=row('ঠিকানা',e.address);
  if(e.timing)    h+=row('সময়সূচি',e.timing);
  if(e.phone)     h+=row('ফোন',`<a href="tel:${e.phone}" style="color:var(--primary)">${e.phone}</a>`);
  if(e.description) h+=row('বিস্তারিত',e.description);
  document.getElementById('detBody').innerHTML=h;
  // actions
  let acts='';
  if(e.mapUrl) acts+=`<a class="btn btn-outline" href="${e.mapUrl}" target="_blank" style="flex:1">🗺️ গুগল ম্যাপ</a>`;
  if(e.phone)  acts+=`<a class="btn btn-primary" href="tel:${e.phone}" style="flex:1">📞 ফোন করুন</a>`;
  acts+=`<button class="btn btn-wa" onclick="shareWA('${id}')" style="flex:1">📲 WhatsApp</button>`;
  document.getElementById('detActions').innerHTML=acts;
  om('detMo');
  // load reviews
  loadReviews(id);
  // show review form
  if(CU){document.getElementById('reviewForm').style.display='';document.getElementById('reviewLoginMsg').style.display='none';}
  else{document.getElementById('reviewForm').style.display='none';document.getElementById('reviewLoginMsg').style.display='';}
}
function row(label,val){return `<div class="dr"><div class="dl">${label}</div><div class="dv">${val}</div></div>`;}

// REVIEWS
async function loadReviews(entryId){
  const el=document.getElementById('reviewsList');
  el.innerHTML='<p style="color:var(--muted);font-size:.83rem">লোড হচ্ছে...</p>';
  try{
    const snap=await db.collection('entries').doc(entryId).collection('reviews').orderBy('createdAt','desc').limit(10).get();
    if(snap.empty){el.innerHTML='<p style="color:var(--muted);font-size:.82rem">এখনো কোনো রিভিউ নেই। প্রথম রিভিউ দিন!</p>';return;}
    el.innerHTML=snap.docs.map(d=>{
      const r=d.data();
      return `<div class="review-item">
        <div class="review-stars">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</div>
        ${r.text?`<div class="review-text">${r.text}</div>`:''}
        <div class="review-date">${r.createdAt?new Date(r.createdAt.toDate()).toLocaleDateString('bn-BD'):''}</div>
      </div>`;
    }).join('');
  }catch{el.innerHTML='<p style="color:var(--muted);font-size:.82rem">রিভিউ লোড সমস্যা</p>';}
}

async function submitReview(){
  if(!CU){showToast('লগইন করুন','bad');return;}
  const ratingEl=document.querySelector('input[name="rating"]:checked');
  if(!ratingEl){showToast('রেটিং দিন','bad');return;}
  const rating=parseInt(ratingEl.value);
  const text=document.getElementById('reviewText').value.trim();
  try{
    const ref=db.collection('entries').doc(currentEntryId).collection('reviews');
    // check duplicate
    const dup=await ref.where('uid','==',CU.uid).get();
    if(!dup.empty){showToast('আপনি আগেই রিভিউ দিয়েছেন','bad');return;}
    await ref.add({rating,text,uid:CU.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    // update avg
    const all=await ref.get();
    const avg=all.docs.reduce((s,d)=>s+(d.data().rating||0),0)/all.size;
    await db.collection('entries').doc(currentEntryId).update({avgRating:avg,reviewCount:all.size});
    // update local
    const idx=allEntries.findIndex(x=>x.id===currentEntryId);
    if(idx>=0){allEntries[idx].avgRating=avg;allEntries[idx].reviewCount=all.size;}
    document.getElementById('reviewText').value='';
    document.querySelector('input[name="rating"]:checked').checked=false;
    loadReviews(currentEntryId);
    showToast('রিভিউ জমা হয়েছে ✅','ok');
  }catch(e){showToast('সমস্যা: '+e.message,'bad');}
}

// WHATSAPP SHARE
function shareWA(id){
  const e=allEntries.find(x=>x.id===id);
  if(!e) return;
  const txt=`*${e.title}*\n${e.specialty?'বিশেষজ্ঞ: '+e.specialty+'\n':''}${e.thana?'📍 '+e.thana+'\n':''}${e.phone?'📞 '+e.phone+'\n':''}${e.address?'🏢 '+e.address+'\n':''}\nসুনামগঞ্জ জিলা ডিরেক্টরি থেকে: ${location.href}`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

// PRINT single entry

  const w=window.open('','_blank','width=600,height=700');
  w.document.write(`<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"/>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet"/>
    <style>body{font-family:'Hind Siliguri',sans-serif;padding:2rem;max-width:600px;margin:0 auto}
    h1{font-family:'Noto Serif Bengali',serif;color:#0d7c6e;margin-bottom:1rem}
    .row{margin-bottom:.7rem;padding-bottom:.7rem;border-bottom:1px solid #e5e7eb}
    .lbl{font-size:.75rem;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:.2rem}
    .val{font-size:.92rem;color:#1a1a2e}
    footer{margin-top:2rem;font-size:.75rem;color:#9ca3af;text-align:center}
    @media print{button{display:none}}</style></head><body>
    <h1>${e.title||''}</h1>
    ${e.specialty?`<div class="row"><div class="lbl">বিশেষজ্ঞ</div><div class="val">${e.specialty}</div></div>`:''}
    ${e.education?`<div class="row"><div class="lbl">শিক্ষাগত যোগ্যতা</div><div class="val">${e.education}</div></div>`:''}
    ${e.workplace?`<div class="row"><div class="lbl">কর্মস্থল</div><div class="val">${e.workplace}</div></div>`:''}
    ${e.thana?`<div class="row"><div class="lbl">থানা</div><div class="val">${e.thana}</div></div>`:''}
    ${e.address?`<div class="row"><div class="lbl">ঠিকানা</div><div class="val">${e.address}</div></div>`:''}
    ${e.chambers?`<div class="row"><div class="lbl">চেম্বার</div><div class="val">${e.chambers}</div></div>`:''}
    ${e.timing?`<div class="row"><div class="lbl">সময়সূচি</div><div class="val">${e.timing}</div></div>`:''}
    ${e.phone?`<div class="row"><div class="lbl">ফোন</div><div class="val">${e.phone}</div></div>`:''}
    ${e.description?`<div class="row"><div class="lbl">বিস্তারিত</div><div class="val">${e.description}</div></div>`:''}
    <footer>সুনামগঞ্জ জিলা লোকাল ডিরেক্টরি | ${new Date().toLocaleDateString('bn-BD')}</footer>
    <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

// SUBMIT from listing
let lsiFile=null;
function lprevSImg(e){
  const f=e.target.files[0];if(!f)return;lsiFile=f;
  const r=new FileReader();
  r.onload=ev=>{const i=document.getElementById('lsiPrev');i.src=ev.target.result;i.style.display='block';document.getElementById('lsiPh').style.display='none';};
  r.readAsDataURL(f);
}
function openSubModal(){
  if(!CU){showToast('এন্ট্রি যোগ করতে index.html থেকে লগইন করুন','bad');return;}
  om('subMo');
}
async function lsubmitEntry(){
  const ct=document.getElementById('lsCt').value, ti=document.getElementById('lsTi').value.trim();
  const er=document.getElementById('lsErr'); er.style.display='none';
  if(!ct||!ti){er.textContent='ক্যাটাগরি ও শিরোনাম আবশ্যক';er.style.display='block';return;}
  const b=document.getElementById('lsBtn');b.disabled=true;b.textContent='জমা দেওয়া হচ্ছে...';
  try{
    let imageUrl='';
    if(lsiFile){const r=new FileReader();imageUrl=await new Promise((res,rej)=>{r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(lsiFile);});}
    await db.collection('pending').add({
      category:ct,title:ti,thana:document.getElementById('lsTh').value,
      specialty:document.getElementById('lsSp').value.trim(),phone:document.getElementById('lsPh').value.trim(),
      address:document.getElementById('lsAd').value.trim(),timing:document.getElementById('lsTm').value.trim(),
      mapUrl:document.getElementById('lsMp').value.trim(),description:document.getElementById('lsDc').value.trim(),
      imageUrl,submittedBy:CU.uid,status:'pending',
      submittedAt:firebase.firestore.FieldValue.serverTimestamp(),
    });
    cm('subMo');
    ['lsCt','lsTh','lsTi','lsSp','lsPh','lsAd','lsTm','lsMp','lsDc'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('lsiPrev').style.display='none';document.getElementById('lsiPh').style.display='';lsiFile=null;
    showToast('জমা দেওয়া হয়েছে! অনুমোদনের অপেক্ষায় 📤','ok');
  }catch(e){er.textContent='সমস্যা: '+e.message;er.style.display='block';}
  b.disabled=false;b.textContent='📤 জমা দিন (অনুমোদনের জন্য)';
}

function showToast(msg,type=''){
  const t=document.getElementById('toast');t.textContent=msg;t.className='show '+(type||'');
  setTimeout(()=>t.className='',2800);
}

loadEntries();
