<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>লিস্টিং — সুনামগঞ্জ জিলা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --primary:#0d7c6e;--primary-dark:#085f54;--accent:#f5a623;
  --bg:#f4f6f8;--white:#fff;--text:#1a1a2e;--muted:#6b7280;
  --border:#e5e7eb;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--text)}

header{
  background:var(--primary);height:56px;
  display:flex;align-items:center;
  padding:0 1rem;gap:.7rem;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.back-btn{
  background:rgba(255,255,255,.18);border:none;
  color:#fff;font-size:1.1rem;width:36px;height:36px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.header-title{
  font-family:'Noto Serif Bengali',serif;
  color:#fff;font-size:1.1rem;font-weight:700;flex:1;
}
.search-header{
  background:rgba(255,255,255,.15);border:none;outline:none;
  color:#fff;font-family:'Hind Siliguri',sans-serif;font-size:.9rem;
  padding:.35rem .8rem;border-radius:50px;width:140px;
}
.search-header::placeholder{color:rgba(255,255,255,.6)}

/* ── FILTER BAR ── */
.filter-bar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:.5rem 1rem;display:flex;gap:.5rem;overflow-x:auto;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{
  background:var(--bg);border:1px solid var(--border);
  border-radius:50px;padding:.3rem .9rem;
  font-size:.78rem;font-weight:500;white-space:nowrap;
  cursor:pointer;transition:all .2s;font-family:'Hind Siliguri',sans-serif;
  color:var(--text);
}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── LIST ── */
.list-wrap{max-width:480px;margin:0 auto;padding:.8rem 1rem 80px;}

.entry-card{
  background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);margin-bottom:.8rem;
  overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);
  transition:box-shadow .2s;
}
.entry-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}

.entry-img{
  width:100%;height:160px;object-fit:cover;
  background:linear-gradient(135deg,#e0f2f1,#b2dfdb);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;
}
.entry-img img{width:100%;height:100%;object-fit:cover}
.entry-body{padding:.85rem 1rem}

.entry-poster{
  display:flex;align-items:center;gap:.5rem;
  margin-bottom:.5rem;
}
.poster-ava{
  width:32px;height:32px;border-radius:50%;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;font-weight:700;flex-shrink:0;
  overflow:hidden;
}
.poster-ava img{width:100%;height:100%;object-fit:cover}
.poster-info{flex:1}
.poster-name{font-size:.8rem;font-weight:600;color:var(--text)}
.poster-date{font-size:.72rem;color:var(--muted)}

.entry-title{
  font-family:'Noto Serif Bengali',serif;
  font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.2rem;
}
.entry-specialty{font-size:.82rem;color:var(--primary);font-weight:600;margin-bottom:.15rem}
.entry-place{font-size:.8rem;color:var(--muted);margin-bottom:.5rem}
.entry-desc{font-size:.85rem;color:#374151;line-height:1.65;margin-bottom:.7rem}

.entry-actions{display:flex;gap:.5rem}
.btn{
  flex:1;padding:.5rem;border-radius:8px;border:none;
  font-family:'Hind Siliguri',sans-serif;font-size:.82rem;
  font-weight:600;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:.3rem;transition:all .2s;text-decoration:none;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:#f0faf8}
.btn-red{background:#fff;color:#ef4444;border:1px solid #fca5a5}
.btn-red:hover{background:#fef2f2}

/* Modal */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:200;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--white);border-radius:20px 20px 0 0;
  width:100%;max-width:480px;padding:1.5rem 1.2rem 2rem;
  max-height:90vh;overflow-y:auto;
  animation:slide-up .3s ease;
}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{
  font-family:'Noto Serif Bengali',serif;font-size:1.1rem;font-weight:700;
  color:var(--primary);text-align:center;margin-bottom:1rem;
  padding-bottom:.7rem;border-bottom:2px solid var(--primary);
}
.detail-row{margin-bottom:.7rem}
.detail-label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.15rem}
.detail-val{font-size:.92rem;color:var(--text);line-height:1.6}
.modal-actions{display:flex;gap:.6rem;margin-top:1rem}
.btn-close-modal{
  width:100%;background:#f3f4f6;border:none;
  color:#ef4444;font-family:'Hind Siliguri',sans-serif;
  font-size:.9rem;font-weight:700;padding:.7rem;
  border-radius:8px;cursor:pointer;
}

/* Skeleton */
.skeleton{
  background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
  background-size:200% 100%;animation:shimmer 1.2s infinite;
  border-radius:6px;
}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state .big{font-size:3rem;margin-bottom:.5rem}
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="header-title" id="pageTitle">লোড হচ্ছে...</span>
  <input class="search-header" id="searchInput" type="text" placeholder="খুঁজুন..."/>
</header>

<div class="filter-bar" id="filterBar">
  <button class="filter-chip active" data-thana="">সব উপজেলা</button>
  <button class="filter-chip" data-thana="সুনামগঞ্জ সদর">সদর</button>
  <button class="filter-chip" data-thana="ছাতক">ছাতক</button>
  <button class="filter-chip" data-thana="জগন্নাথপুর">জগন্নাথপুর</button>
  <button class="filter-chip" data-thana="দিরাই">দিরাই</button>
  <button class="filter-chip" data-thana="ধর্মপাশা">ধর্মপাশা</button>
  <button class="filter-chip" data-thana="দোয়ারাবাজার">দোয়ারাবাজার</button>
  <button class="filter-chip" data-thana="তাহিরপুর">তাহিরপুর</button>
  <button class="filter-chip" data-thana="বিশ্বম্ভরপুর">বিশ্বম্ভরপুর</button>
  <button class="filter-chip" data-thana="শাল্লা">শাল্লা</button>
  <button class="filter-chip" data-thana="জামালগঞ্জ">জামালগঞ্জ</button>
  <button class="filter-chip" data-thana="মধ্যনগর">মধ্যনগর</button>
  <button class="filter-chip" data-thana="দক্ষিণ সুনামগঞ্জ">দক্ষিণ সুনামগঞ্জ</button>
</div>

<div class="list-wrap" id="listWrap">
  <!-- entries -->
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <a id="modalMap" class="btn btn-outline" href="#" target="_blank">🗺️ গুগল ম্যাপ</a>
      <a id="modalCall" class="btn btn-primary" href="#">📞 ফোন করুন</a>
    </div>
    <button class="btn-close-modal" onclick="document.getElementById('modalOverlay').classList.remove('open')">বন্ধ করুন</button>
  </div>
</div>

<script>
// ── Firebase config (same as index.html) ──
const firebaseConfig = {
  apiKey: "AIzaSyA9GwLcflSBxtQK363uo3Gnc0FV6mdZqQ0",
  authDomain: "sunamganj-zila-610da.firebaseapp.com",
  projectId: "sunamganj-zila-610da",
  storageBucket: "sunamganj-zila-610da.firebasestorage.app",
  messagingSenderId: "679956536370",
  appId: "1:679956536370:web:c8ab22f72aa0431d94b02b",
  measurementId: "G-QDV39Z1C1B"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── URL params ──
const params = new URLSearchParams(location.search);
const CAT    = params.get('cat') || '';
const NAME   = params.get('name') || 'লিস্টিং';
const SEARCH = params.get('search') || '';

document.getElementById('pageTitle').textContent = SEARCH ? `"${SEARCH}" এর ফলাফল` : NAME;
if(SEARCH) document.getElementById('searchInput').value = SEARCH;

let allEntries = [];
let activeThana = '';
let searchQ = SEARCH;

// ── Render ──
function renderEntries(list){
  const wrap = document.getElementById('listWrap');
  if(!list.length){
    wrap.innerHTML=`<div class="empty-state"><div class="big">🔍</div><p>কোনো তথ্য পাওয়া যায়নি</p></div>`;
    return;
  }
  wrap.innerHTML = list.map(e=>`
    <div class="entry-card">
      <div class="entry-img" onclick="openModal(${JSON.stringify(e).replace(/"/g,'&quot;')})">
        ${e.imageUrl ? `<img src="${e.imageUrl}" alt="${e.title}" loading="lazy"/>` : `<span>${e.icon||'📋'}</span>`}
      </div>
      <div class="entry-body">
        <div class="entry-poster">
          <div class="poster-ava">${e.posterName?e.posterName[0]:'A'}</div>
          <div class="poster-info">
            <div class="poster-name">${e.posterName||'অ্যাডমিন'}</div>
            <div class="poster-date">${formatDate(e.createdAt)}</div>
          </div>
        </div>
        <div class="entry-title">${e.title}</div>
        ${e.specialty?`<div class="entry-specialty">বিশেষজ্ঞঃ ${e.specialty}</div>`:''}
        ${e.thana?`<div class="entry-place">📍 ${e.thana} থানা</div>`:''}
        ${e.address?`<div class="entry-place">🏢 ${e.address}</div>`:''}
        ${e.description?`<div class="entry-desc">${e.description.substring(0,120)}${e.description.length>120?'...':''}</div>`:''}
        <div class="entry-actions">
          <button class="btn btn-outline" onclick="openModal(${JSON.stringify(e).replace(/"/g,'&quot;')})">বিস্তারিত জানুন</button>
          ${e.mapUrl?`<a class="btn btn-outline" href="${e.mapUrl}" target="_blank">🗺️ ম্যাপ</a>`:''}
          ${e.phone?`<a class="btn btn-primary" href="tel:${e.phone}">📞 ফোন</a>`:''}
        </div>
      </div>
    </div>`).join('');
}

function formatDate(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'});
}

// ── Load ──
async function loadEntries(){
  document.getElementById('listWrap').innerHTML=`
    <div style="padding:1rem">
      ${[1,2,3].map(()=>`
        <div class="entry-card" style="padding:1rem">
          <div class="skeleton" style="height:140px;border-radius:8px;margin-bottom:.8rem"></div>
          <div class="skeleton" style="height:16px;width:60%;margin-bottom:.5rem"></div>
          <div class="skeleton" style="height:12px;width:80%"></div>
        </div>`).join('')}
    </div>`;
  try{
    let q = db.collection('entries');
    if(CAT && !SEARCH) q = q.where('category','==',CAT);
    q = q.orderBy('createdAt','desc');
    const snap = await q.get();
    allEntries = snap.docs.map(d=>({id:d.id,...d.data()}));
    applyFilters();
  } catch(e){
    document.getElementById('listWrap').innerHTML=
      `<div class="empty-state"><div class="big">⚠️</div><p>ডেটা লোড করতে সমস্যা হয়েছে<br><small>Firebase config সেটআপ করুন</small></p></div>`;
  }
}

function applyFilters(){
  let list = [...allEntries];
  if(activeThana) list = list.filter(e=>e.thana===activeThana);
  if(searchQ) list = list.filter(e=>{
    const q=searchQ.toLowerCase();
    return (e.title||'').toLowerCase().includes(q)||
           (e.description||'').toLowerCase().includes(q)||
           (e.specialty||'').toLowerCase().includes(q)||
           (e.address||'').toLowerCase().includes(q);
  });
  renderEntries(list);
}

// ── Thana filter ──
document.querySelectorAll('.filter-chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeThana = btn.dataset.thana;
    applyFilters();
  });
});

// ── Search ──
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ = e.target.value.trim();
  applyFilters();
});

// ── Modal ──
function openModal(e){
  if(typeof e === 'string') e = JSON.parse(e);
  document.getElementById('modalTitle').textContent = e.title;
  let html='';
  if(e.specialty)   html+=row('বিশেষজ্ঞ',e.specialty);
  if(e.education)   html+=row('শিক্ষাগত যোগ্যতা',e.education);
  if(e.workplace)   html+=row('বর্তমান কর্মস্থল',e.workplace);
  if(e.chambers)    html+=row('চেম্বার',e.chambers);
  if(e.thana)       html+=row('থানা',e.thana);
  if(e.address)     html+=row('ঠিকানা',e.address);
  if(e.timing)      html+=row('সময়সূচি',e.timing);
  if(e.phone)       html+=row('ফোন',e.phone);
  if(e.description) html+=row('বিস্তারিত',e.description);
  document.getElementById('modalBody').innerHTML=html;
  const mapBtn=document.getElementById('modalMap');
  const callBtn=document.getElementById('modalCall');
  mapBtn.href=e.mapUrl||'#'; mapBtn.style.display=e.mapUrl?'':'none';
  callBtn.href=e.phone?`tel:${e.phone}`:'#'; callBtn.style.display=e.phone?'':'none';
  document.getElementById('modalOverlay').classList.add('open');
}
function row(label,val){
  return `<div class="detail-row"><div class="detail-label">${label}</div><div class="detail-val">${val}</div></div>`;
}
function closeModal(e){
  if(e.target===document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}

loadEntries();
</script>
</body>
</html>
